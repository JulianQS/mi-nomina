<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Mi Nómina</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js" crossorigin></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js" crossorigin></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #f1f5f9; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    select { -webkit-appearance: none; appearance: none; }
  </style>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel">
    const { useState, useEffect, useMemo } = React;

    // ── CONSTANTS (Colombia 2026) ─────────────────────────────
    const MONTHLY_MIN_WAGE  = 1750905;
    const MONTHLY_TRANSPORT = 249095;
    const MONTHLY_ACCRUAL   = 15 / 12;

    const EMP_COLORS = [
      'bg-indigo-500','bg-violet-500','bg-pink-500','bg-emerald-500',
      'bg-amber-500','bg-sky-500','bg-rose-500','bg-teal-500'
    ];
    const MONTH_NAMES = [
      'Enero','Febrero','Marzo','Abril','Mayo','Junio',
      'Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'
    ];

    // ── DEFAULT DATA ──────────────────────────────────────────
    const DEFAULT_DB = {
      active: "emp_demo",
      employees: [{
        id: "emp_demo",
        name: "María", last_name: "García", cedula: "", phone: "", email: "",
        contract_start: "2026-01-01",
        salary_history: [
          { date: "2026-01-01", amount: 1750905, is_minimum: true, note: "Ingreso" }
        ],
        initial_balance: 0, initial_date: "2026-01-01",
        pto_events: []
      }]
    };

    // ── STORAGE / MIGRATION ───────────────────────────────────
    function loadDB() {
      try {
        const v2 = localStorage.getItem('mi_nomina_db');
        if (v2) return JSON.parse(v2);
        const v1 = localStorage.getItem('pto_db');
        if (v1) {
          const old = JSON.parse(v1);
          return {
            active: "emp_migrated",
            employees: [{
              id: "emp_migrated",
              name: old.employee || "Empleada", last_name: "",
              cedula: "", phone: "", email: "",
              contract_start: old.initial_date,
              salary_history: [{ date: old.initial_date, amount: MONTHLY_MIN_WAGE, is_minimum: true, note: "Ingreso" }],
              initial_balance: old.initial_balance,
              initial_date: old.initial_date,
              pto_events: old.pto_events || []
            }]
          };
        }
      } catch {}
      return DEFAULT_DB;
    }

    // ── DATE HELPERS ──────────────────────────────────────────
    function parseDate(s) { return new Date(s + 'T12:00:00'); }
    function endOfMonth(year, month) { return new Date(year, month + 1, 0); }
    function monthsBetween(start, end) {
      if (end < start) return 0;
      let count = 0, y = start.getFullYear(), m = start.getMonth();
      while (true) {
        const eom = endOfMonth(y, m);
        if (eom > end) break;
        if (eom > start) count++;
        m++; if (m > 11) { m = 0; y++; }
      }
      return count;
    }
    function daysUntil(d) {
      const a = new Date(); a.setHours(0,0,0,0);
      const b = new Date(d); b.setHours(0,0,0,0);
      return Math.ceil((b - a) / 86400000);
    }
    function nextAccrualDate() {
      const t = new Date();
      const eom = endOfMonth(t.getFullYear(), t.getMonth());
      return t.getDate() >= eom.getDate()
        ? endOfMonth(t.getFullYear(), t.getMonth() + 1) : eom;
    }

    // ── PTO CALCULATIONS ──────────────────────────────────────
    function calcAccrued(emp, until = new Date()) {
      return Math.round(monthsBetween(parseDate(emp.initial_date), until) * MONTHLY_ACCRUAL * 100) / 100;
    }
    function calcTaken(emp) {
      return Math.round((emp.pto_events || []).reduce((s, e) => s + e.days, 0) * 100) / 100;
    }
    function calcBalance(emp, until = new Date()) {
      return Math.round((emp.initial_balance + calcAccrued(emp, until) - calcTaken(emp)) * 100) / 100;
    }

    // ── SALARY HELPERS ────────────────────────────────────────
    function getEffectiveSalary(emp, dateStr) {
      const hist = (emp.salary_history || [])
        .filter(s => s.date <= dateStr)
        .sort((a, b) => b.date.localeCompare(a.date));
      if (!hist.length) return { monthly: MONTHLY_MIN_WAGE, is_minimum: true, has_transport: true };
      const e = hist[0];
      const monthly = e.is_minimum ? MONTHLY_MIN_WAGE : e.amount;
      return { monthly, is_minimum: e.is_minimum, has_transport: monthly <= 2 * MONTHLY_MIN_WAGE };
    }
    function getCurrentSalary(emp) {
      return getEffectiveSalary(emp, new Date().toISOString().slice(0, 10));
    }

    // ── PAYROLL ───────────────────────────────────────────────
    function quincenaBounds(year, month1, half) {
      if (half === 1)
        return { start: new Date(year, month1-1, 1), end: new Date(year, month1-1, 15),
          label: `${MONTH_NAMES[month1-1]} ${year} — 1ª quincena (1–15)` };
      const last = new Date(year, month1, 0).getDate();
      return { start: new Date(year, month1-1, 16), end: new Date(year, month1-1, last),
        label: `${MONTH_NAMES[month1-1]} ${year} — 2ª quincena (16–${last})` };
    }
    function ptoDaysInRange(emp, start, end) {
      return (emp.pto_events || [])
        .filter(e => { const d = parseDate(e.date); return d >= start && d <= end; })
        .reduce((s, e) => s + e.days, 0);
    }
    function calcPayroll(emp, year, month1, half) {
      const q = quincenaBounds(year, month1, half);
      const sal = getEffectiveSalary(emp, q.end.toISOString().slice(0, 10));
      const salQ = Math.round(sal.monthly / 2);
      const tMonthly = sal.has_transport !== false ? MONTHLY_TRANSPORT : 0;
      const tQ = Math.round(tMonthly / 2);
      const tDay = Math.round(tMonthly / 30);
      const ss = Math.round(salQ * 0.08);
      const ptoDays = ptoDaysInRange(emp, q.start, q.end);
      const tDed = tDay * ptoDays;
      const netT = tQ - tDed;
      return { ...q, ptoDays, salary: salQ, netTransport: netT, transportDeduction: tDed,
        transportQ: tQ, grossTotal: salQ + netT, socialSecurity: ss,
        net: salQ + netT - ss, isMinimum: sal.is_minimum, monthlySalary: sal.monthly };
    }

    // ── PRIMA ─────────────────────────────────────────────────
    function semesters(year) {
      return [
        { label:'1er semestre', period:`Ene 1 – Jun 30, ${year}`,
          start: new Date(year,0,1), end: new Date(year,5,30),
          dueDate: new Date(year,5,30) },
        { label:'2do semestre', period:`Jul 1 – Dic 31, ${year}`,
          start: new Date(year,6,1), end: new Date(year,11,31),
          dueDate: new Date(year,11,20) },
      ];
    }
    function daysBetween30(d1, d2) {
      const y1=d1.getFullYear(), m1=d1.getMonth(), dd1=Math.min(d1.getDate(),30);
      const y2=d2.getFullYear(), m2=d2.getMonth(), dd2=Math.min(d2.getDate(),30);
      return (y2-y1)*360 + (m2-m1)*30 + (dd2-dd1) + 1;
    }
    function calcPrimaDays(emp, sem) {
      const cs = parseDate(emp.contract_start);
      const aStart = cs > sem.start ? cs : sem.start;
      if (aStart > sem.end) return 0;
      return Math.min(180, Math.max(0, daysBetween30(aStart, sem.end)));
    }
    function calcPrima(emp, sem) {
      const days = calcPrimaDays(emp, sem);
      if (days === 0) return { days:0, amount:0, inProgress:false };
      const sal = getEffectiveSalary(emp, sem.end.toISOString().slice(0,10));
      const transport = sal.has_transport ? MONTHLY_TRANSPORT : 0;
      const amount = Math.round((sal.monthly + transport) * days / 360);
      const today = new Date(); today.setHours(0,0,0,0);
      const semEnd = new Date(sem.end); semEnd.setHours(0,0,0,0);
      const months = Math.round(days / 30 * 100) / 100;
      return { days, months, amount, salary: sal.monthly, inProgress: today <= semEnd };
    }

    // ── FORMATTING ────────────────────────────────────────────
    const fmtCOP = n => new Intl.NumberFormat('es-CO', { style:'currency', currency:'COP', minimumFractionDigits:0 }).format(n);
    const fmtDate = s => parseDate(s).toLocaleDateString('es-CO', { day:'2-digit', month:'short', year:'numeric' });
    const initials = emp => `${(emp.name||'?')[0]}${(emp.last_name||'')[0]||''}`.toUpperCase();
    const empColor = i => EMP_COLORS[i % EMP_COLORS.length];

    // ── SHARED COMPONENTS ─────────────────────────────────────
    function Card({ children, className='' }) {
      return <div className={`bg-white rounded-2xl shadow-sm border border-gray-100 ${className}`}>{children}</div>;
    }
    function Badge({ children, color='blue' }) {
      const c = { blue:'bg-blue-100 text-blue-700', green:'bg-green-100 text-green-700',
        red:'bg-red-100 text-red-700', yellow:'bg-yellow-100 text-yellow-700',
        purple:'bg-purple-100 text-purple-700', orange:'bg-orange-100 text-orange-700',
        gray:'bg-gray-100 text-gray-600' }[color]||'bg-gray-100 text-gray-700';
      return <span className={`inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold ${c}`}>{children}</span>;
    }
    function StatCard({ title, value, sub }) {
      return (
        <Card className="p-4">
          <p className="text-xs font-medium text-gray-500 truncate">{title}</p>
          <p className="text-2xl font-bold text-gray-800 mt-1 leading-none">{value}</p>
          {sub && <p className="text-xs text-gray-400 mt-1 truncate">{sub}</p>}
        </Card>
      );
    }
    function InputField({ label, value, onChange, type='text', placeholder='', error='', required=false, min, step }) {
      return (
        <div>
          {label && <label className="block text-xs font-medium text-gray-500 mb-1">{label}{required && <span className="text-red-400 ml-0.5">*</span>}</label>}
          <input type={type} value={value} onChange={onChange} placeholder={placeholder} min={min} step={step}
            className={`w-full border rounded-xl px-3 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-indigo-400 bg-white ${error ? 'border-red-300' : 'border-gray-200'}`} />
          {error && <p className="text-xs text-red-500 mt-0.5">{error}</p>}
        </div>
      );
    }
    function SelectField({ label, value, onChange, children }) {
      return (
        <div>
          {label && <label className="block text-xs font-medium text-gray-500 mb-1">{label}</label>}
          <div className="relative">
            <select value={value} onChange={e => onChange(e.target.value)}
              className="w-full border border-gray-200 rounded-xl px-3 py-2.5 text-sm bg-white focus:outline-none focus:ring-2 focus:ring-indigo-400 pr-8 cursor-pointer">
              {children}
            </select>
            <div className="pointer-events-none absolute inset-y-0 right-2 flex items-center text-gray-400">
              <svg className="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
                <path fillRule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clipRule="evenodd"/>
              </svg>
            </div>
          </div>
        </div>
      );
    }
    function SalaryToggle({ value, onChange }) {
      return (
        <div className="flex gap-2">
          {[['minimum','Mínimo 2026'],['custom','Personalizado']].map(([v,l]) => (
            <button key={v} type="button" onClick={() => onChange(v)}
              className={`flex-1 py-2.5 rounded-xl text-sm font-semibold border transition-colors ${value===v ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-gray-600 border-gray-200 hover:bg-gray-50'}`}>
              {l}
            </button>
          ))}
        </div>
      );
    }
    function BottomSheet({ title, onClose, children }) {
      return (
        <div className="fixed inset-0 z-50 flex items-end justify-center">
          <div className="absolute inset-0 bg-black/40" onClick={onClose} />
          <div className="relative bg-white rounded-t-3xl w-full max-w-lg max-h-[90vh] flex flex-col shadow-2xl">
            <div className="flex items-center justify-between px-5 py-4 border-b border-gray-100 flex-shrink-0">
              <h2 className="text-base font-bold text-gray-800">{title}</h2>
              <button onClick={onClose} className="w-8 h-8 flex items-center justify-center rounded-full text-gray-400 hover:bg-gray-100 transition-colors">
                <svg className="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
                  <path fillRule="evenodd" d="M4.293 4.293a1 1 0 011.414 0L10 8.586l4.293-4.293a1 1 0 111.414 1.414L11.414 10l4.293 4.293a1 1 0 01-1.414 1.414L10 11.414l-4.293 4.293a1 1 0 01-1.414-1.414L8.586 10 4.293 5.707a1 1 0 010-1.414z" clipRule="evenodd"/>
                </svg>
              </button>
            </div>
            <div className="overflow-y-auto flex-1 p-5">{children}</div>
          </div>
        </div>
      );
    }

    // ── PRIMA VIEW ────────────────────────────────────────────
    function PrimaView({ emp, semIdx, year = new Date().getFullYear() }) {
      const allRows = semesters(year).map((sem,i) => ({ ...sem, ...calcPrima(emp, sem), _i:i })).filter(r => r.days > 0);
      const rows = semIdx !== undefined ? allRows.filter(r => r._i === semIdx) : allRows;
      if (!rows.length) return null;
      const today = new Date(); today.setHours(0,0,0,0);
      const todayStr = today.toLocaleDateString('es-CO', { day:'2-digit', month:'short' });
      return (
        <Card className="overflow-hidden">
          <div className="px-4 py-3 bg-gray-50 border-b border-gray-100">
            <p className="text-sm font-semibold text-gray-700">Prima de Servicios {year}</p>
          </div>
          <div className="divide-y divide-gray-50">
            {rows.map(r => {
              const due = new Date(r.dueDate); due.setHours(0,0,0,0);
              const daysLeft = Math.ceil((due - today) / 86400000);
              const urgent = r.inProgress && daysLeft >= 0 && daysLeft <= 30;
              return (
                <div key={r.label} className="px-4 py-3 space-y-2">
                  <div className="flex items-center justify-between">
                    <p className="text-sm font-semibold text-gray-700">{r.label}</p>
                    <p className="text-lg font-black text-gray-800 tabular-nums">{fmtCOP(r.amount)}</p>
                  </div>
                  <div className="flex flex-wrap gap-x-4 gap-y-0.5">
                    <span className="text-xs text-gray-400">{r.period}</span>
                    <span className="text-xs text-gray-400">{r.months} meses · 2.5 días/mes</span>
                    <span className="text-xs text-gray-400">{fmtCOP(r.salary)}/mes</span>
                  </div>
                  <div className="flex items-center justify-between">
                    <span className="text-xs text-gray-500">
                      {r.inProgress ? 'Proyectado al cierre del semestre' : 'Total'}
                    </span>
                    <span className={`text-xs font-semibold ${urgent?'text-red-500':'text-gray-400'}`}>
                      Vence: {r.dueDate.toLocaleDateString('es-CO',{day:'2-digit',month:'short',year:'numeric'})}
                    </span>
                  </div>
                </div>
              );
            })}
          </div>
        </Card>
      );
    }

    // ── ENROLL FORM ───────────────────────────────────────────
    function EnrollForm({ onSave, onBack }) {
      const today = new Date().toISOString().slice(0, 10);
      const [f, setF] = useState({ name:'', last_name:'', cedula:'', phone:'', email:'',
        contract_start: today, salary_type:'minimum', custom_salary:'',
        initial_balance:'0', initial_date: today });
      const [err, setErr] = useState({});
      const set = field => e => setF(p => ({ ...p, [field]: e.target.value }));

      function submit(e) {
        e.preventDefault();
        const errs = {};
        if (!f.name.trim()) errs.name = 'Requerido';
        if (!f.last_name.trim()) errs.last_name = 'Requerido';
        if (!f.contract_start) errs.contract_start = 'Requerido';
        if (f.salary_type === 'custom' && (!f.custom_salary || parseFloat(f.custom_salary) <= 0))
          errs.custom_salary = 'Ingresa un valor válido';
        if (Object.keys(errs).length) { setErr(errs); return; }
        const amount = f.salary_type === 'minimum' ? MONTHLY_MIN_WAGE : parseFloat(f.custom_salary);
        onSave({
          id: `emp_${Date.now()}`,
          name: f.name.trim(), last_name: f.last_name.trim(),
          cedula: f.cedula.trim(), phone: f.phone.trim(), email: f.email.trim(),
          contract_start: f.contract_start,
          salary_history: [{ date: f.contract_start, amount, is_minimum: f.salary_type==='minimum', note:'Ingreso' }],
          initial_balance: parseFloat(f.initial_balance)||0,
          initial_date: f.initial_date || f.contract_start,
          pto_events: []
        });
      }

      return (
        <form onSubmit={submit} className="space-y-4">
          <div className="grid grid-cols-2 gap-3">
            <InputField label="Nombre"   value={f.name}      onChange={set('name')}      error={err.name}      required />
            <InputField label="Apellido" value={f.last_name} onChange={set('last_name')} error={err.last_name} required />
          </div>
          <InputField label="Cédula / ID" value={f.cedula} onChange={set('cedula')} placeholder="1234567890" />
          <div className="grid grid-cols-2 gap-3">
            <InputField label="Teléfono" value={f.phone} onChange={set('phone')} type="tel" />
            <InputField label="Email"    value={f.email} onChange={set('email')} type="email" />
          </div>
          <InputField label="Inicio de contrato" value={f.contract_start} onChange={set('contract_start')} type="date" error={err.contract_start} required />
          <div>
            <label className="block text-xs font-medium text-gray-500 mb-2">Salario</label>
            <SalaryToggle value={f.salary_type} onChange={v => setF(p => ({ ...p, salary_type:v }))} />
            <div className="mt-2">
              {f.salary_type === 'minimum'
                ? <p className="text-xs text-gray-400 bg-gray-50 rounded-xl px-3 py-2.5">{fmtCOP(MONTHLY_MIN_WAGE)} / mes · Subsidio de transporte incluido</p>
                : <InputField label="Salario mensual (COP)" value={f.custom_salary} onChange={set('custom_salary')} type="number" placeholder={String(MONTHLY_MIN_WAGE)} error={err.custom_salary} />
              }
            </div>
          </div>
          <div>
            <label className="block text-xs font-medium text-gray-500 mb-2">Saldo de vacaciones al ingresar</label>
            <div className="grid grid-cols-2 gap-3">
              <InputField label="Días" value={f.initial_balance} onChange={set('initial_balance')} type="number" min="0" step="0.5" placeholder="0" />
              <InputField label="Fecha del saldo" value={f.initial_date} onChange={set('initial_date')} type="date" />
            </div>
          </div>
          <div className="flex gap-3 pt-1">
            {onBack && (
              <button type="button" onClick={onBack}
                className="flex-1 py-3 rounded-xl text-sm font-semibold border border-gray-200 text-gray-600 hover:bg-gray-50 transition-colors">
                ← Volver
              </button>
            )}
            <button type="submit" className="flex-1 py-3 rounded-xl text-sm font-semibold bg-indigo-600 text-white hover:bg-indigo-700 transition-colors shadow-sm">
              Enrolar
            </button>
          </div>
        </form>
      );
    }

    // ── EMPLOYEE PICKER ───────────────────────────────────────
    function EmployeePicker({ db, onSelect, onClose, onEnroll }) {
      const [view, setView] = useState('list');
      if (view === 'enroll') {
        return (
          <BottomSheet title="Nueva empleada" onClose={onClose}>
            <EnrollForm onSave={emp => { onEnroll(emp); onClose(); }} onBack={() => setView('list')} />
          </BottomSheet>
        );
      }
      return (
        <BottomSheet title="Empleadas" onClose={onClose}>
          <div className="space-y-2 mb-4">
            {db.employees.map((emp, idx) => {
              const active = emp.id === db.active;
              const bal = calcBalance(emp);
              return (
                <button key={emp.id} onClick={() => { onSelect(emp.id); onClose(); }}
                  className={`w-full flex items-center gap-3 p-3 rounded-xl border transition-colors text-left ${active ? 'border-indigo-200 bg-indigo-50' : 'border-gray-100 hover:bg-gray-50'}`}>
                  <div className={`w-10 h-10 rounded-full ${empColor(idx)} flex items-center justify-center text-white font-bold text-sm flex-shrink-0`}>
                    {initials(emp)}
                  </div>
                  <div className="flex-1 min-w-0">
                    <p className="text-sm font-semibold text-gray-800">{emp.name} {emp.last_name}</p>
                    <p className="text-xs text-gray-400">desde {emp.contract_start}</p>
                  </div>
                  <div className="flex items-center gap-2 flex-shrink-0">
                    <Badge color={bal>=5?'green':bal>=2?'yellow':'red'}>{bal}d</Badge>
                    {active && (
                      <svg className="w-4 h-4 text-indigo-600" viewBox="0 0 20 20" fill="currentColor">
                        <path fillRule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clipRule="evenodd"/>
                      </svg>
                    )}
                  </div>
                </button>
              );
            })}
          </div>
          <button onClick={() => setView('enroll')}
            className="w-full flex items-center justify-center gap-2 py-3 rounded-xl border-2 border-dashed border-indigo-200 text-indigo-600 text-sm font-semibold hover:bg-indigo-50 transition-colors">
            <svg className="w-5 h-5" viewBox="0 0 20 20" fill="currentColor">
              <path fillRule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-11a1 1 0 10-2 0v2H7a1 1 0 100 2h2v2a1 1 0 102 0v-2h2a1 1 0 100-2h-2V7z" clipRule="evenodd"/>
            </svg>
            Enrolar nueva empleada
          </button>
        </BottomSheet>
      );
    }

    // ── DASHBOARD ─────────────────────────────────────────────
    function Dashboard({ emp }) {
      const balance  = calcBalance(emp);
      const accrued  = calcAccrued(emp);
      const taken    = calcTaken(emp);
      const nextAccr = nextAccrualDate();
      const daysLeft = daysUntil(nextAccr);
      const [balColor, balLabel] = balance>=5 ? ['green','Disponible'] : balance>=2 ? ['yellow','Bajo'] : ['red','Crítico'];
      const sal    = getCurrentSalary(emp);
      const recent = [...(emp.pto_events||[])].reverse().slice(0,5);

      return (
        <div className="space-y-5 pb-2">
          <div className="rounded-2xl bg-gradient-to-br from-indigo-600 to-indigo-800 p-6 text-white shadow-lg">
            <div className="flex items-start justify-between">
              <div>
                <p className="text-indigo-200 text-xs font-semibold uppercase tracking-widest">Saldo de Vacaciones</p>
                <p className="text-6xl font-black mt-2 leading-none">{balance}</p>
                <p className="text-indigo-200 mt-1 text-sm">días disponibles</p>
              </div>
              <Badge color={balColor}>{balLabel}</Badge>
            </div>
            <div className="mt-5 pt-4 border-t border-indigo-500 flex justify-between text-sm">

                <p className="text-indigo-300 text-xs">Próxima acumulación</p>
                <p className="text-white font-semibold">+1.25 días</p>
              </div>
              <div className="text-right">
                <p className="text-indigo-300 text-xs">en {daysLeft} días</p>
                <p className="text-white font-semibold">
                  {nextAccr.toLocaleDateString('es-CO',{day:'numeric',month:'long'})}

          <div className="grid grid-cols-2 gap-3">

            <StatCard title="Días tomados"     value={taken}   sub="total registrado" />
            <StatCard title="Balance inicial"  value={emp.initial_balance} sub={`al ${emp.initial_date}`} />

          </div>
          <Card>
            <div className="px-4 py-3 border-b border-gray-100">
              <p className="text-sm font-semibold text-gray-700">Últimas ausencias</p>

            {recent.length===0
              ? <p className="px-4 py-6 text-sm text-gray-400 text-center">Sin registros aún.</p>

                  {recent.map((e,i) => (
                    <div key={i} className="flex items-center gap-3 px-4 py-3">
                      <div className="w-2 h-2 rounded-full bg-red-400 flex-shrink-0"/>
                      <div className="flex-1 min-w-0">
                        <p className="text-sm text-gray-700 font-medium truncate">{e.comment||'—'}</p>
                        <p className="text-xs text-gray-400">{fmtDate(e.date)}</p>
                      </div>
                      <Badge color="red">−{e.days}d</Badge>
                    </div>
                  ))}

            }
          </Card>
        </div>
      );

    // ── PAYROLL ───────────────────────────────────────────────
    function Payroll({ emp }) {
      const today = new Date();
      const [year,  setYear]  = useState(String(today.getFullYear()));
      const [month, setMonth] = useState(String(today.getMonth()+1));
      const [half,  setHalf]  = useState(today.getDate()<=15?'1':'2');

      function handleMonthChange(m) {
        setMonth(m);
        if (half === 'prima' && m !== '6' && m !== '12') setHalf('1');
      }

      const showPrima = half === 'prima';
      const p = useMemo(() => calcPayroll(emp,+year,+month, showPrima?1:+half), [emp,year,month,half,showPrima]);
      const noVacNet = p.salary + p.transportQ - p.socialSecurity;

      return (
        <div className="space-y-5 pb-2">
          <Card className="p-4">
            <p className="text-sm font-semibold text-gray-700 mb-3">Seleccionar quincena</p>
            <div className="grid grid-cols-3 gap-3">
              <SelectField label="Año" value={year} onChange={setYear}>
                {[2025,2026,2027].map(y=><option key={y} value={y}>{y}</option>)}
              </SelectField>
              <SelectField label="Mes" value={month} onChange={handleMonthChange}>
                {MONTH_NAMES.map((m,i)=><option key={i} value={i+1}>{m}</option>)}
              </SelectField>
              <SelectField label="Período" value={half} onChange={setHalf}>
                <option value="1">1ª (1–15)</option>
                <option value="2">2ª (16–fin)</option>
                {(month==='6'||month==='12') && <option value="prima">Prima</option>}
              </SelectField>
            </div>
          </Card>
          {showPrima ? (
            <PrimaView emp={emp} semIdx={month==='6'?0:1} year={+year} />
          ) : (
            <>
              <Card className="overflow-hidden">
                <div className="px-4 py-3 bg-gray-50 border-b border-gray-100">
                  <p className="text-sm font-semibold text-gray-700">{p.label}</p>
                  <div className="flex gap-2 mt-1 flex-wrap">
                    <Badge color={p.isMinimum?'blue':'purple'}>{p.isMinimum?'Salario mínimo':'Personalizado'} · {fmtCOP(p.monthlySalary)}/mes</Badge>
                    {p.ptoDays>0 && <Badge color="orange">{p.ptoDays}d vacaciones</Badge>}
                  </div>
                </div>
                <div className="divide-y divide-gray-50">
                  <div className="flex items-center justify-between px-4 py-3">
                    <p className="text-sm text-gray-700">Salario base</p>
                    <p className="text-sm font-semibold text-gray-800 tabular-nums">{fmtCOP(p.salary)}</p>
                  </div>
                  <div className="flex items-start justify-between px-4 py-3">
                    <div>
                      <p className="text-sm text-gray-700">Subsidio de transporte</p>
                      {p.transportDeduction>0 && (
                        <p className="text-xs text-orange-500 mt-0.5">
                          {fmtCOP(p.transportQ)} − {fmtCOP(p.transportDeduction)} ({p.ptoDays}d vacac.)
                        </p>
                      )}
                      {p.transportQ===0 && <p className="text-xs text-gray-400 mt-0.5">No aplica (salario &gt; 2× mínimo)</p>}
                    </div>
                    <p className="text-sm font-semibold text-gray-800 tabular-nums">{fmtCOP(p.netTransport)}</p>
                  </div>
                  <div className="flex items-center justify-between px-4 py-3 bg-gray-50">
                    <p className="text-sm font-semibold text-gray-700">Total devengado</p>
                    <p className="text-sm font-bold text-gray-800 tabular-nums">{fmtCOP(p.grossTotal)}</p>
                  </div>
                  <div className="flex items-start justify-between px-4 py-3">
                    <div>
                      <p className="text-sm text-red-600">Seguridad social (8%)</p>
                      <p className="text-xs text-gray-400 mt-0.5">Salud 4% + Pensión 4%</p>
                    </div>
                    <p className="text-sm font-semibold text-red-600 tabular-nums">−{fmtCOP(p.socialSecurity)}</p>
                  </div>
                </div>
                <div className="bg-indigo-600 px-4 py-4 flex items-center justify-between">
                  <div>
                    <p className="text-indigo-200 text-xs font-semibold uppercase tracking-wider">Neto a pagar</p>
                    {p.ptoDays>0 && <p className="text-indigo-300 text-xs mt-0.5">sin vacaciones: {fmtCOP(noVacNet)}</p>}
                  </div>
                  <p className="text-white text-2xl font-black tabular-nums">{fmtCOP(p.net)}</p>
                </div>
              </Card>
              {p.isMinimum && (
                <Card className="p-4">
                  <p className="text-xs font-semibold text-gray-400 uppercase tracking-wider mb-3">Valores fijos 2026</p>
                  <div className="space-y-1.5">
                    {[
                      ['Salario mensual mínimo',         fmtCOP(MONTHLY_MIN_WAGE)],
                      ['Subsidio transporte mensual',    fmtCOP(MONTHLY_TRANSPORT)],
                      ['Salario por quincena',           fmtCOP(Math.round(MONTHLY_MIN_WAGE/2))],
                      ['Subsidio transporte / quincena', fmtCOP(Math.round(MONTHLY_TRANSPORT/2))],
                      ['Deducción por día vacaciones',   fmtCOP(Math.round(MONTHLY_TRANSPORT/30))],
                      ['Seguridad social quincena',      fmtCOP(Math.round(MONTHLY_MIN_WAGE/2*0.08))],
                    ].map(([k,v]) => (
                      <div key={k} className="flex justify-between py-1 border-b border-gray-50 last:border-0">
                        <span className="text-xs text-gray-500">{k}</span>
                        <span className="text-xs font-semibold text-gray-700 tabular-nums">{v}</span>
                      </div>
                    ))}
                  </div>
                </Card>
              )}
            </>
          )}
        </div>
      );
    }

    // ── PTO HISTORY ───────────────────────────────────────────
    function History({ emp, onUpdate }) {
      function deleteEvent(idx) {
        if (!confirm('¿Eliminar esta ausencia?')) return;
        onUpdate({ ...emp, pto_events: emp.pto_events.filter((_,i) => i!==idx) });
      }
      const events = (emp.pto_events||[]).map((e,i) => {
        const taken = emp.pto_events.slice(0,i+1).reduce((s,x)=>s+x.days,0);
        const bal = Math.round((emp.initial_balance + calcAccrued(emp,parseDate(e.date)) - taken)*100)/100;
        return { ...e, balanceAfter: bal, idx: i };
      });
      return (
        <div className="space-y-4 pb-2">
          <Card className="p-4">
            <div className="flex items-center justify-between">
              <div>
                <p className="text-xs text-gray-500 font-medium">Balance inicial</p>
                <p className="text-sm text-gray-700 font-semibold mt-0.5">{emp.initial_balance} días — {emp.initial_date}</p>
              </div>
              <Badge color="blue">+1.25 días/mes</Badge>
            </div>
          </Card>
          <Card className="overflow-hidden">
            <div className="px-4 py-3 bg-gray-50 border-b border-gray-100 flex items-center justify-between">
              <p className="text-sm font-semibold text-gray-700">Ausencias registradas</p>
              <Badge color="purple">{events.length} eventos</Badge>
            </div>
            {events.length===0
              ? <p className="px-4 py-8 text-sm text-center text-gray-400">Sin registros.</p>
              : <div className="divide-y divide-gray-50">
                  {events.map(e => (
                    <div key={e.idx} className="flex items-center gap-3 px-4 py-3 group hover:bg-gray-50 transition-colors">
                      <div className="w-2 h-2 rounded-full bg-red-400 flex-shrink-0"/>
                      <div className="flex-1 min-w-0">
                        <p className="text-sm text-gray-800 font-medium truncate">{e.comment||'—'}</p>
                        <p className="text-xs text-gray-400">{fmtDate(e.date)}</p>
                      </div>
                      <div className="text-right flex-shrink-0">
                        <Badge color="red">−{e.days}d</Badge>
                        <p className="text-xs text-gray-400 mt-0.5">saldo: {e.balanceAfter}d</p>
                      </div>
                      <button onClick={() => deleteEvent(e.idx)}
                        className="opacity-0 group-hover:opacity-100 w-7 h-7 flex items-center justify-center rounded-full text-red-400 hover:bg-red-50 transition-all flex-shrink-0">
                        <svg className="w-4 h-4" viewBox="0 0 20 20" fill="currentColor">
                          <path fillRule="evenodd" d="M9 2a1 1 0 00-.894.553L7.382 4H4a1 1 0 000 2v10a2 2 0 002 2h8a2 2 0 002-2V6a1 1 0 100-2h-3.382l-.724-1.447A1 1 0 0011 2H9zM7 8a1 1 0 012 0v6a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v6a1 1 0 102 0V8a1 1 0 00-1-1z" clipRule="evenodd"/>
                        </svg>
                      </button>
                    </div>
                  ))}
                </div>
            }
            <div className="px-4 py-3 bg-gray-50 border-t border-gray-100 flex justify-between items-center">
              <p className="text-sm font-semibold text-gray-600">Total tomado</p>
              <p className="text-sm font-bold text-gray-800">{calcTaken(emp)} días</p>
            </div>
          </Card>
        </div>
      );
    }

    // ── ADD PTO ───────────────────────────────────────────────
    function AddPTO({ emp, onUpdate }) {
      const today = new Date().toISOString().slice(0,10);
      const [f, setF] = useState({ date:today, days:'', comment:'' });
      const [success, setSuccess] = useState(false);
      const [error, setError] = useState('');
      const set = field => e => setF(p => ({ ...p, [field]: e.target.value }));
      const preview = f.days && parseFloat(f.days)>0
        ? Math.round((calcBalance(emp)-parseFloat(f.days))*100)/100 : null;

      function submit(e) {
        e.preventDefault();
        const days = parseFloat(f.days);
        if (!f.date) { setError('Ingresa una fecha.'); return; }
        if (!days||days<=0) { setError('Ingresa días válidos.'); return; }
        setError('');
        onUpdate({ ...emp,
          pto_events: [...(emp.pto_events||[]), { date:f.date, days, comment:f.comment.trim() }]
            .sort((a,b) => a.date.localeCompare(b.date))
        });
        setSuccess(true);
        setF({ date:today, days:'', comment:'' });
        setTimeout(() => setSuccess(false), 3000);
      }

      return (
        <div className="space-y-4 pb-2">
          <Card className="p-5">
            <p className="text-sm font-semibold text-gray-700 mb-4">Registrar ausencia</p>
            <form onSubmit={submit} className="space-y-4">
              <InputField label="Fecha" value={f.date} onChange={set('date')} type="date" />
              <InputField label="Días" value={f.days} onChange={set('days')} type="number" min="0.5" step="0.5" placeholder="1.0" />
              <InputField label="Comentario" value={f.comment} onChange={set('comment')} placeholder="Ej: incapacidad, vacaciones" />
              {error && <div className="bg-red-50 border border-red-100 rounded-xl px-3 py-2 text-red-600 text-sm">{error}</div>}
              {success && <div className="bg-green-50 border border-green-100 rounded-xl px-3 py-2 text-green-700 text-sm font-medium">✓ Ausencia registrada.</div>}
              <button type="submit" className="w-full bg-indigo-600 hover:bg-indigo-700 text-white rounded-xl py-3 text-sm font-semibold transition-colors shadow-sm">
                Registrar
              </button>
            </form>
          </Card>
          {preview!==null && (
            <Card className={`p-4 ${preview<0?'bg-red-50 border-red-100':'bg-amber-50 border-amber-100'}`}>
              <p className={`text-sm font-semibold ${preview<0?'text-red-700':'text-amber-700'}`}>Vista previa</p>
              <div className="space-y-1 mt-2">
                <div className="flex justify-between"><span className="text-xs text-gray-500">Saldo actual</span><span className="text-sm font-semibold text-gray-700">{calcBalance(emp)}d</span></div>
                <div className="flex justify-between"><span className="text-xs text-gray-500">A descontar</span><span className="text-sm font-semibold text-red-600">−{f.days}d</span></div>
                <div className="flex justify-between pt-1 border-t border-amber-200">
                  <span className="text-xs font-semibold text-gray-700">Saldo resultante</span>
                  <span className={`text-sm font-bold ${preview<0?'text-red-700':'text-gray-800'}`}>{preview}d</span>
                </div>
              </div>
              {preview<0 && <p className="text-xs text-red-600 mt-2 font-medium">⚠ El saldo quedaría negativo.</p>}
            </Card>
          )}
          <Card className="p-4 bg-indigo-50 border-indigo-100">
            <div className="flex items-center justify-between">
              <p className="text-sm text-indigo-700 font-medium">Saldo disponible hoy</p>
              <p className="text-xl font-black text-indigo-700">{calcBalance(emp)} días</p>
            </div>
          </Card>
        </div>
      );
    }

    // ── PROFILE ───────────────────────────────────────────────
    function Profile({ emp, onUpdate, empIdx }) {
      const [editing, setEditing] = useState(false);
      const [editF, setEditF] = useState({
        name: emp.name, last_name: emp.last_name||'',
        cedula: emp.cedula||'', phone: emp.phone||'', email: emp.email||''
      });
      const [showSalForm, setShowSalForm] = useState(false);
      const [salF, setSalF] = useState({
        date: new Date().toISOString().slice(0,10),
        salary_type:'minimum', amount:'', note:''
      });
      const setE = f => e => setEditF(p => ({ ...p, [f]: e.target.value }));
      const setS = f => e => setSalF(p => ({ ...p, [f]: e.target.value }));

      function saveEdit() { onUpdate({ ...emp, ...editF }); setEditing(false); }

      function addSalary(e) {
        e.preventDefault();
        const isMin = salF.salary_type === 'minimum';
        const amount = isMin ? MONTHLY_MIN_WAGE : parseFloat(salF.amount);
        if (!isMin && (!amount || amount <= 0)) return;
        const entry = { date: salF.date, amount, is_minimum: isMin, note: salF.note.trim() };
        const hist = [...(emp.salary_history||[]), entry].sort((a,b) => a.date.localeCompare(b.date));
        onUpdate({ ...emp, salary_history: hist });
        setShowSalForm(false);
        setSalF({ date: new Date().toISOString().slice(0,10), salary_type:'minimum', amount:'', note:'' });
      }

      const sal = getCurrentSalary(emp);
      const sortedHist = [...(emp.salary_history||[])].sort((a,b) => b.date.localeCompare(a.date));

      return (
        <div className="space-y-5 pb-2">
          <Card className="p-5">
            <div className="flex items-center gap-4">
              <div className={`w-16 h-16 rounded-2xl ${empColor(empIdx)} flex items-center justify-center text-white text-2xl font-black flex-shrink-0`}>
                {initials(emp)}
              </div>
              <div className="flex-1 min-w-0">
                <p className="text-lg font-bold text-gray-800">{emp.name} {emp.last_name}</p>
                <p className="text-xs text-gray-400">Contrato desde {emp.contract_start}</p>
                <div className="flex gap-1.5 mt-1.5 flex-wrap">
                  <Badge color="blue">{sal.is_minimum?'Salario mínimo':'Personalizado'}</Badge>
                  <Badge color="green">{calcBalance(emp)}d disponibles</Badge>
                </div>
              </div>
            </div>
          </Card>

          <Card>
            <div className="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
              <p className="text-sm font-semibold text-gray-700">Información personal</p>
              <button onClick={() => setEditing(!editing)} className="text-xs font-semibold text-indigo-600 hover:text-indigo-700">
                {editing ? 'Cancelar' : 'Editar'}
              </button>
            </div>
            {editing ? (
              <div className="p-4 space-y-3">
                <div className="grid grid-cols-2 gap-3">
                  <InputField label="Nombre"   value={editF.name}      onChange={setE('name')} />
                  <InputField label="Apellido" value={editF.last_name} onChange={setE('last_name')} />
                </div>
                <InputField label="Cédula"   value={editF.cedula} onChange={setE('cedula')} />
                <InputField label="Teléfono" value={editF.phone}  onChange={setE('phone')} type="tel" />
                <InputField label="Email"    value={editF.email}  onChange={setE('email')} type="email" />
                <button onClick={saveEdit} className="w-full bg-indigo-600 text-white rounded-xl py-2.5 text-sm font-semibold hover:bg-indigo-700 transition-colors">
                  Guardar cambios
                </button>
              </div>
            ) : (
              <div className="divide-y divide-gray-50">
                {[['Cédula', emp.cedula||'—'], ['Teléfono', emp.phone||'—'],
                  ['Email', emp.email||'—'], ['Inicio contrato', emp.contract_start]
                ].map(([k,v]) => (
                  <div key={k} className="flex justify-between items-center px-4 py-3">
                    <span className="text-xs text-gray-500">{k}</span>
                    <span className="text-sm text-gray-700 font-medium">{v}</span>
                  </div>
                ))}
              </div>
            )}
          </Card>

          <Card className="overflow-hidden">
            <div className="px-4 py-3 border-b border-gray-100 flex items-center justify-between">
              <p className="text-sm font-semibold text-gray-700">Historial de salarios</p>
              <button onClick={() => setShowSalForm(!showSalForm)} className="text-xs font-semibold text-indigo-600 hover:text-indigo-700">
                {showSalForm ? 'Cancelar' : '+ Actualizar'}
              </button>
            </div>
            {showSalForm && (
              <form onSubmit={addSalary} className="p-4 space-y-3 bg-indigo-50 border-b border-indigo-100">
                <InputField label="Fecha efectiva" value={salF.date} onChange={setS('date')} type="date" />
                <div>
                  <label className="block text-xs font-medium text-gray-500 mb-2">Tipo de salario</label>
                  <SalaryToggle value={salF.salary_type} onChange={v => setSalF(p => ({ ...p, salary_type:v }))} />
                </div>
                {salF.salary_type === 'minimum'
                  ? <p className="text-xs text-gray-500 bg-white rounded-xl px-3 py-2">{fmtCOP(MONTHLY_MIN_WAGE)} / mes</p>
                  : <InputField label="Salario mensual (COP)" value={salF.amount} onChange={setS('amount')} type="number" placeholder={String(MONTHLY_MIN_WAGE)} />
                }
                <InputField label="Nota (opcional)" value={salF.note} onChange={setS('note')} placeholder="Ej: aumento anual" />
                <button type="submit" className="w-full bg-indigo-600 text-white rounded-xl py-2.5 text-sm font-semibold hover:bg-indigo-700 transition-colors">
                  Registrar cambio
                </button>
              </form>
            )}
            {sortedHist.length===0
              ? <p className="px-4 py-6 text-sm text-center text-gray-400">Sin historial.</p>
              : <div className="divide-y divide-gray-50">
                  {sortedHist.map((s,i) => (
                    <div key={i} className={`flex items-center gap-3 px-4 py-3 ${i>0?'opacity-60':''}`}>
                      <div className={`w-2 h-2 rounded-full flex-shrink-0 ${i===0?'bg-green-400':'bg-gray-300'}`}/>
                      <div className="flex-1 min-w-0">
                        <p className="text-sm text-gray-800 font-medium">
                          {s.is_minimum ? `Mínimo — ${fmtCOP(MONTHLY_MIN_WAGE)}` : fmtCOP(s.amount)}
                          <span className="text-xs text-gray-400 ml-1.5">/ mes</span>
                        </p>
                        <p className="text-xs text-gray-400">{fmtDate(s.date)}{s.note?` · ${s.note}`:''}</p>
                      </div>
                      {i===0 && <Badge color="green">Vigente</Badge>}
                    </div>
                  ))}
                </div>
            }
          </Card>
        </div>
      );
    }

    // ── APP ───────────────────────────────────────────────────
    const TABS = [
      { id:'dashboard', label:'Inicio' },
      { id:'payroll',   label:'Quincena' },
      { id:'history',   label:'Historial' },
      { id:'add',       label:'Agregar' },
      { id:'profile',   label:'Perfil' },
    ];
    const ICONS = {
      dashboard: a => <svg className="w-5 h-5" fill={a?'currentColor':'none'} stroke="currentColor" strokeWidth={a?0:2} viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>,
      payroll:   a => <svg className="w-5 h-5" fill={a?'currentColor':'none'} stroke="currentColor" strokeWidth={a?0:2} viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M17 9V7a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2m2 4h10a2 2 0 002-2v-6a2 2 0 00-2-2H9a2 2 0 00-2 2v6a2 2 0 002 2zm7-5a2 2 0 11-4 0 2 2 0 014 0z"/></svg>,
      history:   a => <svg className="w-5 h-5" fill={a?'currentColor':'none'} stroke="currentColor" strokeWidth={a?0:2} viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-3 7h3m-3 4h3m-6-4h.01M9 16h.01"/></svg>,
      add:       a => <svg className="w-5 h-5" fill={a?'currentColor':'none'} stroke="currentColor" strokeWidth={a?0:2} viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M12 9v3m0 0v3m0-3h3m-3 0H9m12 0a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>,
      profile:   a => <svg className="w-5 h-5" fill={a?'currentColor':'none'} stroke="currentColor" strokeWidth={a?0:2} viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/></svg>,
    };

    function App() {
      const [db, setDb] = useState(loadDB);
      const [tab, setTab] = useState('dashboard');
      const [showPicker, setShowPicker] = useState(false);

      useEffect(() => { localStorage.setItem('mi_nomina_db', JSON.stringify(db)); }, [db]);

      const empIdx = db.employees.findIndex(e => e.id === db.active);
      const emp = db.employees[empIdx >= 0 ? empIdx : 0];

      function updateEmp(updated) {
        setDb(d => ({ ...d, employees: d.employees.map(e => e.id===updated.id ? updated : e) }));
      }
      function enrollEmp(newEmp) {
        setDb(d => ({ ...d, active: newEmp.id, employees: [...d.employees, newEmp] }));
      }
      function selectEmp(id) { setDb(d => ({ ...d, active: id })); }

      function exportJSON() {
        const blob = new Blob([JSON.stringify(db,null,2)], { type:'application/json' });
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a'); a.href=url; a.download='mi_nomina.json'; a.click();
        URL.revokeObjectURL(url);
      }
      function importJSON(e) {
        const file = e.target.files[0]; if (!file) return;
        const reader = new FileReader();
        reader.onload = ev => { try { setDb(JSON.parse(ev.target.result)); } catch { alert('Archivo inválido.'); } };
        reader.readAsText(file); e.target.value='';
      }

      const todayStr = new Date().toLocaleDateString('es-CO',{weekday:'long',day:'numeric',month:'long',year:'numeric'});

      return (
        <div className="min-h-screen bg-slate-100 flex flex-col">
          <div className="bg-indigo-700 px-4 pt-8 pb-20 flex-shrink-0">
            <div className="max-w-lg mx-auto flex items-start justify-between">
              <div>
                <button onClick={() => setShowPicker(true)} className="group text-left">
                  <p className="text-indigo-300 text-xs font-semibold uppercase tracking-widest">Empleada activa</p>
                  <div className="flex items-center gap-1.5 mt-0.5">
                    <h1 className="text-white text-2xl font-black">{emp.name} {emp.last_name}</h1>
                    <svg className="w-5 h-5 text-indigo-300 group-hover:text-white transition-colors mt-0.5" viewBox="0 0 20 20" fill="currentColor">
                      <path fillRule="evenodd" d="M5.293 7.293a1 1 0 011.414 0L10 10.586l3.293-3.293a1 1 0 111.414 1.414l-4 4a1 1 0 01-1.414 0l-4-4a1 1 0 010-1.414z" clipRule="evenodd"/>
                    </svg>
                  </div>
                </button>
                <p className="text-indigo-300 text-xs capitalize mt-0.5">{todayStr}</p>
                {db.employees.length>1 && <p className="text-indigo-400 text-xs mt-0.5">{db.employees.length} empleadas registradas</p>}
              </div>
              <div className="flex gap-2 mt-1">
                <label className="cursor-pointer bg-white/10 hover:bg-white/20 text-white text-xs font-medium px-3 py-2 rounded-xl transition-colors border border-white/20">
                  Importar
                  <input type="file" accept=".json" className="hidden" onChange={importJSON} />
                </label>
                <button onClick={exportJSON} className="bg-white/10 hover:bg-white/20 text-white text-xs font-medium px-3 py-2 rounded-xl transition-colors border border-white/20">
                  Exportar
                </button>
              </div>
            </div>
          </div>

          <div className="flex-1 max-w-lg mx-auto w-full px-4 -mt-14 pb-24">
            {tab==='dashboard' && <Dashboard emp={emp} />}
            {tab==='payroll'   && <Payroll   emp={emp} />}
            {tab==='history'   && <History   emp={emp} onUpdate={updateEmp} />}
            {tab==='add'       && <AddPTO    emp={emp} onUpdate={updateEmp} />}
            {tab==='profile'   && <Profile   emp={emp} onUpdate={updateEmp} empIdx={empIdx>=0?empIdx:0} />}
          </div>

          <div className="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-lg z-10">
            <div className="max-w-lg mx-auto flex">
              {TABS.map(t => {
                const active = tab===t.id;
                return (
                  <button key={t.id} onClick={() => setTab(t.id)}
                    className={`flex-1 flex flex-col items-center gap-1 py-3 transition-colors ${active?'text-indigo-600':'text-gray-400 hover:text-gray-600'}`}>
                    {ICONS[t.id](active)}
                    <span className={`text-xs ${active?'font-semibold':''}`}>{t.label}</span>
                  </button>
                );
              })}
            </div>
          </div>

          {showPicker && (
            <EmployeePicker db={db} onSelect={selectEmp} onClose={() => setShowPicker(false)} onEnroll={enrollEmp} />
          )}
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
